<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>CSS Fundamentals Advanced</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- Navbar -->
<nav class="navbar">
  <h2 class="logo">Kevin</h2>
  <ul class="nav-links">
    <li>Home</li>
    <li>About</li>
    <li>Projects</li>
    <li>Contact</li>
  </ul>
</nav>

<!-- Hero Section -->
<section class="hero">
  <h1>Frontend Developer</h1>
  <p>I create responsive and modern web designs</p>
  <button class="btn">Hire Me</button>
</section>

<!-- Cards Section -->
<section class="cards">
  <div class="card">
    <h3>HTML</h3>
    <p>Structured content</p>
  </div>

  <div class="card">
    <h3>CSS</h3>
    <p>Styling & layout</p>
  </div>

  <div class="card">
    <h3>React</h3>
    <p>Dynamic UI</p>
  </div>
</section>

<!-- Grid Section -->
<section class="grid-section">
  <h2>My Skills</h2>
  <div class="grid-container">
    <div class="grid-item">HTML</div>
    <div class="grid-item">CSS</div>
    <div class="grid-item">JavaScript</div>
    <div class="grid-item">React</div>
  </div>
</section>

<!-- Form Section -->
<section class="form-section">
  <h2>Contact Me</h2>
  <form>
    <input type="text" placeholder="Enter name">
    <input type="email" placeholder="Enter email">
    <textarea placeholder="Message"></textarea>
    <button class="btn">Submit</button>
  </form>
</section>

<footer>
  <p>© 2026 Kevin Raj</p>
</footer>

</body>
</html>
