<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Dashboard UI</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- Navbar -->
<header class="navbar">
  <button id="menuBtn">☰</button>
  <h2>Dashboard</h2>
</header>

<div class="layout">

  <!-- Sidebar -->
  <aside class="sidebar" id="sidebar">
    <p>Home</p>
    <p>Users</p>
    <p>Reports</p>
    <p>Settings</p>
  </aside>

  <!-- Main Content -->
  <main class="main">

    <!-- Cards -->
    <section class="cards">
      <div class="card">Users: 120</div>
      <div class="card">Sales: ₹5000</div>
      <div class="card">Visits: 300</div>
    </section>

    <!-- Grid Section -->
    <section class="grid">
      <div class="box">Chart 1</div>
      <div class="box">Chart 2</div>
      <div class="box">Chart 3</div>
      <div class="box">Chart 4</div>
    </section>

  </main>

</div>

<script src="script.js"></script>

</body>
</html>
